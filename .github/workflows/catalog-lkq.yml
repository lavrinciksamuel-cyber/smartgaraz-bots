name: LKQ import
# Scheduled LKQ import.
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      discover:
        description: "Extra catalog step count"
        required: false
        default: "1"
      resume:
        description: "Clear pause"
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: catalog-lkq
  cancel-in-progress: false

env:
  SG_PUBLIC_LOGS: "1"
  PYTHONPATH: ${{ github.workspace }}/bot/public_ci
  SG_GUARD_SLUG: lkq
  SG_POLITE_HOSTS: lkq.sk
  SG_POLITE_MIN: "12"
  SG_POLITE_MAX: "28"
  SG_DAILY_CAP: "40"
  SG_RUN_CAP: "40"
  SG_HTTP_RETRIES: "0"
  SG_LKQ_ONE_LOGIN: "1"
  SG_LKQ_REFRESH_LIMIT: "12"
  SG_LKQ_MAX_PAGES: "2"
  SG_LKQ_NEW_LIMIT: "8"
  CRAWL_DELAY: "0"

jobs:
  lkq:
    if: vars.SG_ACCOUNT_INDEX != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            bot/data/supplier_guard
            bot/data/heijunka_vehicle_queue_state.json
          key: guard-lkq-${{ github.run_id }}
          restore-keys: |
            guard-lkq-
      - run: pip install -r bot/requirements.txt
      - run: mkdir -p bot/data/supplier_guard && echo keep > bot/data/supplier_guard/.keep
      - name: Import
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          PYTHONUNBUFFERED: "1"
          SG_LKQ_NEW_JOBS: ${{ github.event.inputs.discover || '1' }}
          SG_GUARD_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.resume && '1' || '0' }}
        run: python bot/lkq_quiet.py
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot/data/supplier_guard
            bot/data/heijunka_vehicle_queue_state.json
          key: guard-lkq-${{ github.run_id }}
