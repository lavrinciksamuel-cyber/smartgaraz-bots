name: Promote drafts (zverejni hotové koncepty)
# Každé 4 h prejde všetky koncepty a zverejní tie, ktoré spĺňajú pravidlá kvality
# (konkrétna a sediaca kategória, OE číslo pri hlavných dieloch, cena > 0, slovenský
# názov, stav skladu). Fotky nie sú podmienka. Pri zverejnení overí nákup (prítomný,
# rozumný), predaj ≥ nákup s DPH × 1,20 (TSS/ideo +30 %) – inak cenu zdvihne na floor –
# a dostupnosť (Skladom v SR / Sklad v EÚ / Nedostupné). Držané dostanú meta _sg_hold_reason.
on:
  workflow_dispatch:
    inputs:
      classify:
        description: "Zaradiť koncepty do kategórií pred zverejnením (apply | dry-run | off)"
        required: false
        default: "apply"
      classify_max:
        description: "Max. zaradených konceptov za beh"
        required: false
        default: "1500"
      args:
        description: "Argumenty (napr. --dry-run, --max 500)"
        required: false
        default: ""
  schedule:
    # každú hodinu (koncepty z nočných importov sa zaradia a zverejnia v ten istý deň)
    - cron: "40 * * * *"
concurrency:
  group: promote-drafts
  cancel-in-progress: false

env:
  # Public repo: logs are world-readable → redact purchase prices, margins,
  # supplier URLs and search terms in every Python process (bot/log_redact.py).
  SG_PUBLIC_LOGS: "1"
  PYTHONPATH: ${{ github.workspace }}/bot/public_ci

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Classify drafts (pravidlá podľa názvu, bez AI)
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          PYTHONUNBUFFERED: "1"
          CLS: ${{ github.event.inputs.classify || 'apply' }}
          CMAX: ${{ github.event.inputs.classify_max || '1500' }}
        run: |
          if [ "$CLS" = "off" ]; then echo "classifier off"; exit 0; fi
          if [ "$CLS" = "apply" ]; then python bot/draft_classifier.py --apply --max "$CMAX" --out classify-report.json || true
          else python bot/draft_classifier.py --dry-run --out classify-report.json || true; fi
          # zverejnené produkty v dump kategóriách (Auto chémia/Nezaradené) – len kategória
          if [ "$CLS" = "apply" ]; then python bot/draft_classifier.py --apply --published || true; fi
      - name: Promote
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          SG_GUARD_API_SLOW_S: "8"
          PYTHONUNBUFFERED: "1"
        run: |
          python bot/promote_drafts.py --batch 100 --tag-held --out promote-report.json ${{ github.event.inputs.args }}
      # Public repo: no artifacts (world-readable; reports hold supplier URLs
      # and product lists). Print a redacted counts-only summary instead.
      - name: Report summary (redacted)
        if: always()
        run: python bot/public_report_summary.py promote-report.json || true
