name: Enrich images (drafts)
on:
  # Fotky = fáza 2 importu (rozhodnutie 21.10.2026). Cron vypnutý, URL fotiek
  # ostávajú v meta _sg_pending_image; zapnúť odkomentovaním:
  # schedule:
  #   - cron: "10 * * * *"
  workflow_dispatch:
concurrency:
  group: enrich-images
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/cache/restore@v4
        with:
          path: bot/data/enrich_images_state.json
          key: enrich-${{ github.run_id }}
          restore-keys: enrich-
      - env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
        run: python bot/enrich_images.py --budget-min 50
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: bot/data/enrich_images_state.json
          key: enrich-${{ github.run_id }}
