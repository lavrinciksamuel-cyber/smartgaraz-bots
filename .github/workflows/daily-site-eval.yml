name: Daily site eval

# Presunuté zo smartgaraz-web (privátne repo = 0 Actions minút).
# Homepage smoke + katalóg/search insights + customer paths + QA fix (≤40).
#
# PUBLIC REPO: reporty obsahujú hľadané výrazy zákazníkov → NIKDY nie
# artefakt/commit. Do logu ide len redigovaný súhrn bez search sekcií.
# Secrets: WC_*, HQ_SYNC_TOKEN, SG_INSIGHTS_KEY (voliteľné, odporúčané).

on:
  schedule:
    # 04:00 UTC ≈ 06:00 SELČ
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Public repo: logs are world-readable → redact purchase prices, margins,
  # supplier URLs and search terms in every Python process (bot/log_redact.py).
  SG_PUBLIC_LOGS: "1"
  PYTHONPATH: ${{ github.workspace }}/bot/public_ci
  PYTHONUNBUFFERED: "1"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install deps
        run: pip install -r bot/requirements.txt

      - name: Run daily eval
        env:
          WC_URL: ${{ secrets.WC_URL }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          SG_INSIGHTS_KEY: ${{ secrets.SG_INSIGHTS_KEY }}
        working-directory: bot
        run: |
          set -u
          # search_insights prints top/zero-result queries → keep its stdout out of the log.
          python search_insights.py > /dev/null 2>&1 && echo "search_insights: ok" || echo "search_insights: failed/skipped"
          python site_eval.py > /dev/null && echo "site_eval: ok" || echo "site_eval: failed"
          python customer_paths_smoke.py --write-report || true
          python audit_product_qa.py --fix --limit 40 || true

      - name: Report summary (redacted)
        if: always()
        run: python bot/public_report_summary.py 'bot/reports/site-eval-*.md' 'bot/reports/ops-customer-smoke-*.md' || true
