name: Cheap ops (0 € Claude)

# Presunuté zo smartgaraz-web (privátne repo = 0 Actions minút).
#   customer smoke → publish ready → customer smoke → cost guard
# 2×/deň (promote-drafts beží každé 4 h; zdieľa concurrency group, nebežia naraz).
# Quiet okno (07–20 SK) = publish ≤15.
#
# PUBLIC REPO: redakcia logov (SG_PUBLIC_LOGS), žiadne artefakty ani commity.

on:
  schedule:
    - cron: "50 10,22 * * *"
  workflow_dispatch:
    inputs:
      publish_limit:
        description: "Max draft→publish (≤50)"
        required: false
        default: "40"

concurrency:
  group: promote-drafts
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public repo: logs are world-readable → redact purchase prices, margins,
  # supplier URLs and search terms in every Python process (bot/log_redact.py).
  SG_PUBLIC_LOGS: "1"
  PYTHONPATH: ${{ github.workspace }}/bot/public_ci
  PYTHONUNBUFFERED: "1"

jobs:
  cheap-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install deps
        run: pip install -r bot/requirements.txt

      - name: Publish ready drafts + customer smoke + cost note
        env:
          WC_URL: ${{ secrets.WC_URL }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          AI_MODE: cheap
          IMPORT_IN_STOCK: "1"
          REFRESH_SKIP_AI: "1"
          IN_LIMIT: ${{ github.event.inputs.publish_limit }}
        run: |
          set -euo pipefail
          # Jidoka pred publish — padnutý web = žiadna dávka.
          python bot/customer_paths_smoke.py
          LIMIT="${IN_LIMIT:-40}"
          if python -c "import sys; sys.path.insert(0,'bot'); from daytime_quiet import is_daytime_quiet; sys.exit(0 if is_daytime_quiet() else 1)"; then
            LIMIT=15
            echo "Quiet window: publish limit=$LIMIT"
          fi
          python bot/publish_ready_drafts.py --limit "$LIMIT"
          python bot/customer_paths_smoke.py
          python bot/ops_cost_guard.py
