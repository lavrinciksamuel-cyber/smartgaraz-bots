name: Photo fill LKQ

# Small batch. Same pace and concurrency as the LKQ catalog job.
on:
  schedule:
    - cron: "10 6 * * 0,3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-lkq
  cancel-in-progress: false

env:
  SG_PUBLIC_LOGS: "1"
  PYTHONPATH: ${{ github.workspace }}/bot/public_ci
  PYTHONUNBUFFERED: "1"
  SG_GUARD_SLUG: lkq
  SG_POLITE_HOSTS: lkq.sk
  SG_POLITE_MIN: "12"
  SG_POLITE_MAX: "28"
  SG_DAILY_CAP: "24"
  SG_RUN_CAP: "24"
  SG_HTTP_RETRIES: "0"
  SG_LKQ_ONE_LOGIN: "1"
  CRAWL_DELAY: "0"

jobs:
  fill:
    if: vars.SG_ACCOUNT_INDEX != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: bot/data/photo_fill
          key: photo-fill-lkq-${{ github.run_id }}
          restore-keys: photo-fill-lkq-
      - run: pip install -r bot/requirements.txt
      - name: Fill
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          HQ_URL: ${{ secrets.HQ_URL }}
        run: python bot/photo_fill.py --supplier lkq --batch 6
      - if: always()
        run: python bot/public_report_summary.py bot/reports/photo-fill-lkq.json || true
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: bot/data/photo_fill
          key: photo-fill-lkq-${{ github.run_id }}
