name: Probe LKQ availability fields
on:
  workflow_dispatch:
    inputs:
      cats: { description: "category urls (comma)", required: false, default: "" }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: bot/requirements.txt }
      - run: pip install -r bot/requirements.txt
      - env:
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          PROBE_CATS: ${{ github.event.inputs.cats }}
          PYTHONUNBUFFERED: "1"
        run: python bot/probe_lkq_availability.py
