# Nightly mop (≈23:20 SK) — Wave3 default; evening strong je samostatný workflow 20:05 SK.
name: Heijunka parts (nightly staged)

on:
  schedule:
    - cron: "20 21 * * *"   # 21:20 UTC ≈ 23:20 SK (summer)
  workflow_dispatch:
    inputs:
      mode:
        description: "wave3 | wave6 | mop"
        required: false
        default: "wave3"
      jobs:
        description: "Jobs per wave (≤5)"
        required: false
        default: "5"
      limit:
        description: "SKU per job (≤20 recommended)"
        required: false
        default: "20"

env:
  SG_ACCOUNT_INDEX: ${{ vars.SG_ACCOUNT_INDEX || '0' }}
  SG_ACCOUNT_COUNT: ${{ vars.SG_ACCOUNT_COUNT || '2' }}
  # LKQ zapnuté 13.10.2026 (login fix ae8494c); "1" = vypnúť
  SG_LKQ_DISABLED: "0"

jobs:
  heijunka-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Restore import queue state
        uses: actions/cache@v4
        with:
          path: |
            bot/data/heijunka_vehicle_queue_state.json
            bot/data/heijunka_szekop_queue_state.json
            bot/data/wurth_cheap_progress.json
          key: import-queue-state-${{ github.run_id }}
          restore-keys: |
            import-queue-state-
            heijunka-state-

      - name: Install deps
        run: pip install -r bot/requirements.txt

      - name: Supplier logins from HQ
        working-directory: bot
        env:
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
        run: python -m suppliers.hq_credentials lkq szekop wurth

      - name: Prepare + staged heijunka
        env:
          WC_URL: ${{ secrets.WC_URL }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          LKQ_LOGIN_URL: ${{ secrets.LKQ_LOGIN_URL }}
          AI_MODE: cheap
          IMPORT_IN_STOCK: "1"
          SG_DAYTIME_QUIET: force_run
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode }}"
          MODE="${MODE:-wave3}"
          JOBS="${{ github.event.inputs.jobs }}"
          JOBS="${JOBS:-8}"
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT="${LIMIT:-20}"
          if [[ "$LIMIT" -gt 50 ]]; then LIMIT=50; fi
          if [[ "$JOBS" -gt 12 ]]; then JOBS=12; fi

          python bot/prepare_parts_import.py --skip-sync || true
          python bot/sync_taxonomy.py --ensure-only

          case "$MODE" in
            wave6)
              python bot/heijunka_vehicle_parts.py --wave6-only --jobs "$JOBS" --limit "$LIMIT" --sleep 0.3 --reset-failed
              ;;
            mop)
              python bot/heijunka_vehicle_parts.py --jobs "$JOBS" --limit "$LIMIT" --sleep 0.3 --skip-covered
              ;;
            *)
              python bot/heijunka_vehicle_parts.py --wave3-only --jobs "$JOBS" --limit "$LIMIT" --sleep 0.3 --reset-failed
              ;;
          esac

          python bot/publish_ready_drafts.py --limit 40 || true
          python bot/site_eval.py || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parts-heijunka-reports
          path: |
            bot/reports/ops-parts-import-ready-*.md
            bot/reports/ops-heijunka-vehicle-*.md
            bot/reports/site-eval-*.md
          if-no-files-found: ignore
