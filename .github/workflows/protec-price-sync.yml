name: Pro-Tec price and stock sync
# Denne prepočíta existujúce Pro-Tec produkty zo živého B2B (prihlásenie z HQ).
# Beží až kód s výberom produktu podľa .p-code (nie banner P1241).
# Cena = calculate_retail (MOC dodávateľa alebo min. 20 % z nákupu s DPH, ,90).
# Stav publish/draft sa nemení. Najprv SKU 43201, 33179, 22202, X6000-5.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max produktov (0 = všetky Pro-Tec)"
        required: false
        default: "0"
  schedule:
    - cron: "30 3 * * *"
concurrency:
  group: protec-price-sync
  cancel-in-progress: false

env:
  # Public repo: logs are world-readable → redact purchase prices, margins,
  # supplier URLs and search terms in every Python process (bot/log_redact.py).
  SG_PUBLIC_LOGS: "1"
  PYTHONPATH: ${{ github.workspace }}/bot/public_ci

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Sync prices and stock
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          SG_PRIORITY_SKUS: "43201,33179,22202,X6000-5"
          # 160 min < timeout 180: skript skončí sám ako „čiastočne hotovo“, nie zrušený GitHubom
          SG_IMPORT_BUDGET_S: "9600"
          PYTHONUNBUFFERED: "1"
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT=0; fi
          python bot/supplier_import.py --supplier pro-tec --mode prices --limit "$LIMIT"
