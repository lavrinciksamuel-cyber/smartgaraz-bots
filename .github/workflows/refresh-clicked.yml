name: Refresh clicked products

# Presunuté zo smartgaraz-web (privátne repo = 0 Actions minút).
# Produkty s klikom za 24 h — B2B cena/sklad (0 € Claude by default).
# Každých 6 h; ak je fronta prázdna (alebo chýba SG_INSIGHTS_KEY), job skončí
# po ~10 s ešte pred `pip install`.
#
# PUBLIC REPO: logy sú verejné → SG_PUBLIC_LOGS redakcia (nákupné ceny, marže,
# URL dodávateľov, hľadané výrazy). Žiadne artefakty ani commity reportov.
# Dodávateľské loginy idú z HQ (hq_credentials), nie z GitHub secrets.
# Secrets: WC_URL, WC_CONSUMER_KEY, WC_CONSUMER_SECRET, HQ_SYNC_TOKEN, SG_INSIGHTS_KEY.

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max produktov (≤50)"
        required: false
        default: "30"
      dry_run:
        description: "dry-run (true/false)"
        required: false
        default: "false"
      use_ai:
        description: "true = lacná šablóna (AI_MODE=cheap, 0 € Claude); default false = len B2B cena/sklad"
        required: false
        default: "false"

concurrency:
  group: refresh-clicked
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public repo: logs are world-readable → redact purchase prices, margins,
  # supplier URLs and search terms in every Python process (bot/log_redact.py).
  SG_PUBLIC_LOGS: "1"
  PYTHONPATH: ${{ github.workspace }}/bot/public_ci
  PYTHONUNBUFFERED: "1"
  SG_LKQ_DISABLED: "0"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Queue check (skip early when empty)
        id: queue
        env:
          WC_URL: ${{ secrets.WC_URL }}
          SG_INSIGHTS_KEY: ${{ secrets.SG_INSIGHTS_KEY }}
          REFRESH_LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: python3 bot/refresh_queue_check.py

      - name: Setup Python
        if: steps.queue.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install deps
        if: steps.queue.outputs.run == 'true'
        run: pip install -r bot/requirements.txt

      - name: Supplier logins from HQ
        if: steps.queue.outputs.run == 'true'
        working-directory: bot
        env:
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
        run: python -m suppliers.hq_credentials lkq protec metabond wurth szekop

      - name: Run refresh_clicked
        if: steps.queue.outputs.run == 'true'
        env:
          WC_URL: ${{ secrets.WC_URL }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          SG_INSIGHTS_KEY: ${{ secrets.SG_INSIGHTS_KEY }}
          AI_MODE: cheap
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
          IN_AI: ${{ github.event.inputs.use_ai }}
        run: |
          LIMIT="${IN_LIMIT:-30}"
          EXTRA=""
          if [ "$IN_DRY" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ "$IN_AI" = "true" ]; then
            EXTRA="$EXTRA --cheap"; echo "Mode: cheap template (0 € Claude)"
          else
            EXTRA="$EXTRA --skip-ai"; echo "Mode: B2B-only --skip-ai (0 € Claude)"
          fi
          python bot/refresh_clicked.py --limit "$LIMIT" --hours 24 $EXTRA
