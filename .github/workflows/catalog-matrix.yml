name: Catalog matrix (drafts, parallel)
# Plné katalógy LKQ / Szekop / Würth do konceptov. Každý matrix job = vlastný
# shard (crc32 kľúča), vlastný kurzor v actions/cache (ukladá sa aj pri
# zrušení/timeoute) → joby sa neprekrývajú a pokračujú, kde skončili.
# shop_guard pribrzdí, ak HostCreators spomalí. Fotky doplní enrich-images.yml.
on:
  schedule:
    # každých 30 min; per-shard concurrency → nový beh čaká, kým starý skončí (nič sa neruší)
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Rozpočet minút na job"
        required: false
        default: "290"

jobs:
  plan:
    # Rozdelenie medzi účty: repo A (SG_ACCOUNT_INDEX=0) párne shardy, repo B (1) nepárne.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          IDX: ${{ vars.SG_ACCOUNT_INDEX || '0' }}
          CNT: ${{ vars.SG_ACCOUNT_COUNT || '1' }}
          LKQ_N: ${{ vars.SG_LKQ_SHARDS || '20' }}
          SZ_N: ${{ vars.SG_SZEKOP_SHARDS || '16' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          idx, cnt = int(os.environ["IDX"]), int(os.environ["CNT"])
          inc = []
          for sup, n in (("lkq", int(os.environ["LKQ_N"])), ("szekop", int(os.environ["SZ_N"]))):
              inc += [{"supplier": sup, "shard": f"{i}/{n}"} for i in range(n) if i % cnt == idx]
          if idx == 0:
              inc.append({"supplier": "wurth", "shard": "0/1"})
          print("matrix=" + json.dumps({"include": inc}))
          PY
  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Jeden beh na shard naraz (nový čaká, nič sa neruší)
    concurrency:
      group: shard-${{ matrix.supplier }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Shard id
        id: sid
        run: echo "id=${{ matrix.supplier }}-$(echo '${{ matrix.shard }}' | tr '/' 'of')" >> "$GITHUB_OUTPUT"
      - name: Restore shard cursor
        uses: actions/cache/restore@v4
        with:
          path: |
            bot/data/heijunka_vehicle_queue_state.json
            bot/data/shard_state
          key: shard-${{ steps.sid.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            shard-${{ steps.sid.outputs.id }}-
            shard-${{ matrix.supplier }}-
      - name: Install deps
        run: pip install -r bot/requirements.txt
      - name: Import shard
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          IMPORT_IN_STOCK: "1"
          AI_MODE: cheap
          SG_SHARD: ${{ matrix.shard }}
          SG_DEFER_IMAGES: "1"
          PYTHONUNBUFFERED: "1"
          SG_LKQ_JOBS: "4"
          SG_IMPORT_BUDGET_S: ${{ format('{0}', (github.event.inputs.budget_min || '290')) }}
        run: |
          export SG_IMPORT_BUDGET_S=$(( SG_IMPORT_BUDGET_S * 60 ))
          python bot/supplier_import.py --supplier "${{ matrix.supplier }}" --mode full --limit 0
      - name: Save shard cursor
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot/data/heijunka_vehicle_queue_state.json
            bot/data/shard_state
          key: shard-${{ steps.sid.outputs.id }}-${{ github.run_id }}
