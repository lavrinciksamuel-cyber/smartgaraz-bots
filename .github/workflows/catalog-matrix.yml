name: Catalog matrix (drafts, parallel)
# Plné katalógy LKQ / Szekop / Würth do konceptov. Každý matrix job = vlastný
# shard (crc32 kľúča), vlastný kurzor v actions/cache (ukladá sa aj pri
# zrušení/timeoute) → joby sa neprekrývajú a pokračujú, kde skončili.
# shop_guard pribrzdí, ak HostCreators spomalí. Fotky doplní enrich-images.yml.
on:
  schedule:
    - cron: "40 */5 * * *"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Rozpočet minút na job"
        required: false
        default: "290"

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Jeden beh na shard naraz (nový čaká, nič sa neruší)
    concurrency:
      group: shard-${{ matrix.supplier }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { supplier: lkq, shard: "0/3" }
          - { supplier: lkq, shard: "1/3" }
          - { supplier: lkq, shard: "2/3" }
          - { supplier: szekop, shard: "0/3" }
          - { supplier: szekop, shard: "1/3" }
          - { supplier: szekop, shard: "2/3" }
          - { supplier: wurth, shard: "0/2" }
          - { supplier: wurth, shard: "1/2" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Shard id
        id: sid
        run: echo "id=${{ matrix.supplier }}-$(echo '${{ matrix.shard }}' | tr '/' 'of')" >> "$GITHUB_OUTPUT"
      - name: Restore shard cursor
        uses: actions/cache/restore@v4
        with:
          path: |
            bot/data/heijunka_vehicle_queue_state.json
            bot/data/shard_state
          key: shard-${{ steps.sid.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            shard-${{ steps.sid.outputs.id }}-
      - name: Install deps
        run: pip install -r bot/requirements.txt
      - name: Import shard
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          HQ_SYNC_TOKEN: ${{ secrets.HQ_SYNC_TOKEN }}
          IMPORT_IN_STOCK: "1"
          AI_MODE: cheap
          SG_SHARD: ${{ matrix.shard }}
          SG_DEFER_IMAGES: "1"
          SG_LKQ_JOBS: "4"
          SG_IMPORT_BUDGET_S: ${{ format('{0}', (github.event.inputs.budget_min || '290')) }}
        run: |
          export SG_IMPORT_BUDGET_S=$(( SG_IMPORT_BUDGET_S * 60 ))
          python bot/supplier_import.py --supplier "${{ matrix.supplier }}" --mode full --limit 0
      - name: Save shard cursor
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot/data/heijunka_vehicle_queue_state.json
            bot/data/shard_state
          key: shard-${{ steps.sid.outputs.id }}-${{ github.run_id }}
